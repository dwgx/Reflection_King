name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reflection-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/reflection-browser/package-lock.json
      - run: npm ci
      - run: npm run check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reflection-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/reflection-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
