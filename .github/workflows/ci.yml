name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash -n install.sh scripts/deploy/*.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reflection-browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/reflection-browser/package-lock.json
      - run: npm ci
      - run: npm run check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reflection-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/reflection-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --progress=plain -t reflection-king:ci .
      - run: docker compose --env-file .env.docker.example config
      - run: docker compose --env-file .env.docker.example up -d --build
      - name: Wait for Docker health
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8780/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color reflection-king
          exit 1
      - if: always()
        run: docker compose --env-file .env.docker.example down -v
