name: Publish Docker image

# Builds the runtime image and pushes it to GHCR on version tags (v*) and on
# manual dispatch. Consumers deploy the pushed image via docker-compose.ghcr.yml
# without building anything locally.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Pin the image path explicitly: deriving from github.repository
          # yields reflection_king (underscore) from the repo name, but the
          # published/documented image is reflection-king (hyphen).
          images: ghcr.io/dwgx/reflection-king
          # Emit both v-prefixed and bare tags so `v0.1.0` (matching the git
          # tag, as documented) and `0.1.0` both resolve.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
