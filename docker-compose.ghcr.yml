# Deploy the pre-built image from GHCR — no local build required.
#
#   cp .env.docker.example .env.docker
#   docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
#
# REPRODUCIBILITY: the default image is pinned by DIGEST, not a tag. A digest
# (sha256:...) is immutable — the same reference always pulls the exact same
# bytes, so an AI or operator following the deploy doc gets an identical
# deployment every time. Tags (latest, v0.1.0) can be re-pushed and are NOT
# guaranteed identical. See docs/ONE_CLICK_DEPLOY.md for the digest-verify step.
#
# Default = v0.1.0 @ sha256:ad780a20bb0aa8b1717ecc9fead9b77595d1cba51f9241ba69d7d491b355b2ac
#
# To deploy a different build, override RK_IMAGE_REF with another digest:
#   RK_IMAGE_REF=ghcr.io/dwgx/reflection-king@sha256:<digest> \
#     docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
#
# Convenience only (NOT byte-identical — avoid for production): pin by tag:
#   RK_IMAGE_REF=ghcr.io/dwgx/reflection-king:v0.1.0 \
#     docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
services:
  reflection-king:
    image: "${RK_IMAGE_REF:-ghcr.io/dwgx/reflection-king@sha256:ad780a20bb0aa8b1717ecc9fead9b77595d1cba51f9241ba69d7d491b355b2ac}"
    pull_policy: always
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      RK_PUBLIC_PORT: "${RK_PUBLIC_PORT:-8780}"
      RK_PUBLIC_BASE_URL: "${RK_PUBLIC_BASE_URL:-http://localhost:8780}"
      RK_API_KEY: "${RK_API_KEY:-}"
      RK_MAX_DOWNLOAD_MB: "${RK_MAX_DOWNLOAD_MB:-300}"
      RK_MAX_CONCURRENT_JOBS: "${RK_MAX_CONCURRENT_JOBS:-2}"
      RK_JOB_TTL_HOURS: "${RK_JOB_TTL_HOURS:-24}"
      RK_BROWSER_CHANNEL: "${RK_BROWSER_CHANNEL:-chromium}"
      RK_BROWSER_LOCALE: "${RK_BROWSER_LOCALE:-zh-CN}"
      RK_BROWSER_TIMEZONE: "${RK_BROWSER_TIMEZONE:-Asia/Shanghai}"
      RK_BROWSER_VIEWPORT: "${RK_BROWSER_VIEWPORT:-1366x768}"
      RK_BROWSER_LOGIN_VIEWPORT: "${RK_BROWSER_LOGIN_VIEWPORT:-1280x720}"
      RK_BROWSER_USER_AGENT: "${RK_BROWSER_USER_AGENT:-}"
    ports:
      - "${RK_PUBLIC_PORT:-8780}:8780"
    volumes:
      - reflection_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  reflection_data:
